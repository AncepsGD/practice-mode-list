<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Mode List Optimal Ladder</title>
  <link rel="stylesheet" href="styles.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-zinc-950 text-zinc-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useMemo, useState, useEffect } = React;
    const LOCAL_KEY = "pml_edit_data";

    function parseTimeToSeconds(timeStr) {
      if (!timeStr || typeof timeStr !== "string") return null;
      const s = timeStr.trim();
      if (!s) return null;

      const parts = {};
      const tokenRegex = /(\d+)\s*([hms])/gi;
      let match;

      while ((match = tokenRegex.exec(s)) !== null) {
        const unit = match[2].toLowerCase();
        if (parts[unit] !== undefined) return null;
        parts[unit] = parseInt(match[1], 10);
      }

      if (Object.keys(parts).length === 0) return null;

      if ("h" in parts && "m" in parts && parts["m"] >= 60) return null;
      if (("h" in parts || "m" in parts) && "s" in parts && parts["s"] >= 60) return null;

      const h = parts["h"] || 0;
      const m = parts["m"] || 0;
      const sec = parts["s"] || 0;
      const total = h * 3600 + m * 60 + sec;
      return total > 0 ? total : null;
    }

    function calculatePoints(rank, maxRank) {
      if (!rank || !maxRank) return 0;
      const base = 10, top = 360;
      if (maxRank === 1) return top;
      const ratio = Math.pow(top / base, 1 / (maxRank - 1));
      return base * Math.pow(ratio, maxRank - rank);
    }

    function loadLevelsJson() {
      const saved = localStorage.getItem(LOCAL_KEY);
      if (saved) {
        try {
          return Promise.resolve(JSON.parse(saved));
        } catch (_) { }
      }
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      return fetch("levels.json", { signal: controller.signal })
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .finally(() => clearTimeout(timeout));
    }

    function processRawData(data) {
      const rawLevels = data
        .filter(item => item.name)
        .map(item => {
          const victors = (item.victors || []).map(v => ({
            name: v.name || "",
            date: v.date || "",
            time: v.time || "",
            attempts: v.attempts || 0,
            videoUrl: v.video || "",
          }));
          return {
            rank: item.rank,
            name: item.name,
            id: item.id,
            points: 0,
            victors,
            creator: item.creators,
          };
        });

      const maxRank = Math.max(...rawLevels.map(l => l.rank), 1);
      rawLevels.forEach(l => {
        l.points = calculatePoints(l.rank, maxRank);
      });

      rawLevels.forEach(level => {
        let minTimeSec = null;
        let minAttempts = null;
        let wrTimeObj = null;
        let wrAttemptsObj = null;

        level.victors.forEach(v => {
          const sec = parseTimeToSeconds(v.time);
          if (sec !== null && (minTimeSec === null || sec < minTimeSec)) {
            minTimeSec = sec;
            wrTimeObj = { name: v.name, time: v.time };
          }
          if (v.attempts > 0 && (minAttempts === null || v.attempts < minAttempts)) {
            minAttempts = v.attempts;
            wrAttemptsObj = { name: v.name, attempts: v.attempts };
          }
        });

        level.wrTime = wrTimeObj;
        level.wrAttempts = wrAttemptsObj;
      });

      return rawLevels;
    }

    function buildLeaderboard(levels) {
      const map = {};
      levels.forEach(lvl => {
        const orderedVictors = [...lvl.victors].sort((a, b) => {
          const da = Date.parse(a.date);
          const db = Date.parse(b.date);
          const va = Number.isNaN(da) ? Infinity : da;
          const vb = Number.isNaN(db) ? Infinity : db;
          return va - vb;
        });

        const seenInLevel = new Set();
        orderedVictors.forEach((v, vi) => {
          if (!v.name || seenInLevel.has(v.name)) return;
          seenInLevel.add(v.name);

          if (!map[v.name]) map[v.name] = { name: v.name, points: 0, levels: [] };

          let mult = 1;
          if (vi === 0) mult += 0.25;
          if (lvl.wrTime && v.name === lvl.wrTime.name) mult += 0.25;
          if (lvl.wrAttempts && v.name === lvl.wrAttempts.name) mult += 0.25;

          map[v.name].points += lvl.points * mult;
          map[v.name].levels.push(lvl.name);
        });
      });
      return Object.values(map).sort((a, b) => b.points - a.points);
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function trimmedMean(arr, trimFraction = 0.1) {
      if (!arr.length) return null;
      const sorted = [...arr].sort((a, b) => a - b);
      const trimCount = Math.floor(sorted.length * trimFraction);
      const end = sorted.length - trimCount;
      const source = trimCount < end ? sorted.slice(trimCount, end) : sorted;
      return source.reduce((a, b) => a + b, 0) / source.length;
    }

    function geometricMean(arr) {
      if (!arr.length) return null;
      const logSum = arr.reduce((acc, v) => acc + Math.log(v), 0);
      return Math.exp(logSum / arr.length);
    }

    function formatHours(hours) {
      if (hours < 1) return `${(hours * 60).toFixed(1)}m`;
      return `${hours.toFixed(2)}h`;
    }

    function formatSkillMultiplier(skill) {
      return `${skill.toFixed(2)}×`;
    }

    function classifySkill(skill) {
      if (skill < 0.75) return "Elite";
      if (skill < 1) return "Above average";
      if (skill <= 1.25) return "Average";
      return "Below average";
    }

    function describeSkillRelative(skill) {
      if (skill <= 1) {
        const pct = Math.round((1 - skill) * 100);
        return pct > 0 ? `Compared to average victor: ${pct}% faster` : "Compared to average victor: on par";
      }

      const pct = Math.round((skill - 1) * 100);
      return `Compared to average victor: ${pct}% slower`;
    }

    function calculateSkillComponents(levels, playerName) {
      const speedRatios = [];
      const attemptRatios = [];
      const weights = [];

      levels.forEach(lvl => {
        const parsedEntries = lvl.victors
          .map(v => ({
            name: v.name,
            sec: parseTimeToSeconds(v.time),
            attempts: Number.isFinite(Number(v.attempts)) ? Number(v.attempts) : null,
          }))
          .filter(v => v.sec !== null && v.sec > 0);
        if (parsedEntries.length < 2) return;

        const playerEntry = parsedEntries.find(v => v.name === playerName);
        if (!playerEntry) return;

        const timeBaseline = trimmedMean(parsedEntries.map(v => v.sec), 0.2);
        const attemptsWithData = parsedEntries.filter(v => v.attempts !== null && v.attempts > 0);
        const attemptBaseline = attemptsWithData.length
          ? trimmedMean(attemptsWithData.map(v => v.attempts), 0.2)
          : null;

        if (!timeBaseline || timeBaseline <= 0) return;

        const speedRatio = playerEntry.sec / timeBaseline;
        speedRatios.push(speedRatio);

        if (attemptBaseline && attemptBaseline > 0 && playerEntry.attempts !== null && playerEntry.attempts > 0) {
          const attemptRatio = playerEntry.attempts / attemptBaseline;
          attemptRatios.push(attemptRatio);
        }

        weights.push(Math.min(1.6, 0.35 + parsedEntries.length * 0.2));
      });

      const combinedSpeed = speedRatios.length
        ? (() => {
          const weightedMean = speedRatios.reduce((sum, ratio, index) => sum + ratio * weights[index], 0)
            / weights.reduce((sum, weight) => sum + weight, 0);
          const robustRatio = trimmedMean(speedRatios, 0.25) ?? weightedMean;
          return (weightedMean * 0.6) + (robustRatio * 0.4);
        })()
        : 1;

      const combinedAttempts = attemptRatios.length
        ? (() => {
          const weightedMean = attemptRatios.reduce((sum, ratio, index) => sum + ratio * weights[index], 0)
            / weights.reduce((sum, weight) => sum + weight, 0);
          const robustRatio = trimmedMean(attemptRatios, 0.25) ?? weightedMean;
          return (weightedMean * 0.6) + (robustRatio * 0.4);
        })()
        : 1;

      const speedScore = clamp(1 + (combinedSpeed - 1) * Math.min(1, speedRatios.length / 6), 0.7, 1.5);
      const attemptsScore = clamp(1 + (combinedAttempts - 1) * Math.min(1, attemptRatios.length / 6), 0.7, 1.5);

      return {
        speed: speedScore,
        attempts: attemptsScore,
      };
    }

    function calculatePlayerSkill(levels, playerName) {
      const components = calculateSkillComponents(levels, playerName);
      return (components.speed + components.attempts) / 2;
    }

    function calculateAvgTimePerPoint(levels) {
      const ratios = [];
      levels.forEach(lvl => {
        const times = lvl.victors.map(v => parseTimeToSeconds(v.time)).filter(t => t !== null && t > 0);
        if (times.length > 0 && lvl.points > 0) {
          ratios.push(trimmedMean(times) / lvl.points);
        }
      });
      return ratios.length ? trimmedMean(ratios) : null;
    }

    function calculateAvgAttemptsPerPoint(levels) {
      const ratios = [];
      levels.forEach(lvl => {
        const attempts = lvl.victors
          .map(v => Number(v.attempts))
          .filter(a => Number.isFinite(a) && a > 0);
        if (attempts.length > 0 && lvl.points > 0) {
          ratios.push(trimmedMean(attempts) / lvl.points);
        }
      });
      return ratios.length ? trimmedMean(ratios) : null;
    }

    function estimateLevelOutcome(level, components, avgTimePerPoint, avgAttemptsPerPoint) {
      const victorTimes = level.victors
        .map(v => parseTimeToSeconds(v.time))
        .filter(t => t !== null && t > 0);

      const victorAttempts = level.victors
        .map(v => Number(v.attempts))
        .filter(a => Number.isFinite(a) && a > 0);

      let baseTime;
      if (victorTimes.length > 0) {
        baseTime = trimmedMean(victorTimes);
      } else if (avgTimePerPoint !== null && level.points > 0) {
        baseTime = level.points * avgTimePerPoint;
      } else {
        baseTime = 7200;
      }

      let baseAttempts = null;
      if (victorAttempts.length > 0) {
        baseAttempts = trimmedMean(victorAttempts);
      } else if (avgAttemptsPerPoint !== null && level.points > 0) {
        baseAttempts = level.points * avgAttemptsPerPoint;
      }

      const expectedSeconds = baseTime && baseTime > 0
        ? baseTime * components.speed
        : null;

      const expectedAttempts = baseAttempts && baseAttempts > 0
        ? baseAttempts * components.attempts
        : null;

      return { expectedSeconds, expectedAttempts };
    }

    function projectedMultiplierFor(level, expectedSeconds, expectedAttempts) {
      if (level.victors.length === 0) {
        return 1.75;
      }

      const wrTimeSeconds = level.wrTime ? parseTimeToSeconds(level.wrTime.time) : null;
      const timePossible = wrTimeSeconds !== null && expectedSeconds !== null && expectedSeconds < wrTimeSeconds;

      const wrAttempts = level.wrAttempts ? Number(level.wrAttempts.attempts) : null;
      const attemptsPossible = wrAttempts !== null && Number.isFinite(wrAttempts) && expectedAttempts !== null && expectedAttempts < wrAttempts;

      const count = (timePossible ? 1 : 0) + (attemptsPossible ? 1 : 0);
      if (count === 0) return 1.0;
      if (count === 1) return 1.25;

      return 1.5;
    }

    function buildRecommendations(levels, player, avgTimePerPoint, avgAttemptsPerPoint) {
      if (!player) return [];
      const beaten = new Set(player.levels);
      const components = calculateSkillComponents(levels, player.name);

      return levels
        .filter(lvl => !beaten.has(lvl.name))
        .map(lvl => {
          const basePoints = lvl.points || 0;
          if (basePoints <= 0) return null;

          const { expectedSeconds, expectedAttempts } = estimateLevelOutcome(lvl, components, avgTimePerPoint, avgAttemptsPerPoint);
          if (expectedSeconds === null || expectedSeconds <= 0) return null;

          const expectedHours = expectedSeconds / 3600;
          const projectedMult = projectedMultiplierFor(lvl, expectedSeconds, expectedAttempts);
          const projectedPoints = basePoints * projectedMult;
          const expectedValue = projectedPoints / expectedHours;
          const wrTimeSeconds = lvl.wrTime ? parseTimeToSeconds(lvl.wrTime.time) : null;
          const wrAttempts = lvl.wrAttempts ? Number(lvl.wrAttempts.attempts) : null;
          const victorCount = lvl.victors.length;
          const confidence = victorCount > 0 ? (victorCount / (victorCount + 3)) : 0;

          const timeWrPossible = wrTimeSeconds !== null && expectedSeconds !== null && expectedSeconds < wrTimeSeconds;
          const attemptsWrPossible = wrAttempts !== null && Number.isFinite(wrAttempts) && expectedAttempts !== null && expectedAttempts < wrAttempts;
          const hasWrTime = wrTimeSeconds !== null;
          const hasWrAttempts = wrAttempts !== null && Number.isFinite(wrAttempts);

          return {
            level: lvl.name,
            basePoints,
            projectedMult,
            projectedPoints,
            expectedHours,
            expectedValue,
            victorCount: victorCount,
            timeWrPossible,
            attemptsWrPossible,
            hasWrTime,
            hasWrAttempts,
            wrConfidence: confidence,
          };
        })
        .filter(Boolean)
        .sort((a, b) => b.expectedValue - a.expectedValue);
    }

    function optimizeRoute(recommendations, targetPoints, granularity = 4) {
      if (!recommendations.length || targetPoints <= 0) return { time: 0, picks: [] };

      const items = recommendations
        .map(r => ({ ...r, units: Math.round(r.projectedPoints * granularity) }))
        .filter(r => r.units > 0);

      const maxUnits = Math.ceil(targetPoints * granularity);
      const dpTime = new Array(maxUnits + 1).fill(Infinity);
      const dpChoice = new Array(maxUnits + 1).fill(null);
      dpTime[0] = 0;

      for (const item of items) {
        for (let u = maxUnits; u >= 0; u--) {
          if (dpTime[u] === Infinity) continue;
          const nu = Math.min(maxUnits, u + item.units);
          const nt = dpTime[u] + item.expectedHours;
          if (nt < dpTime[nu]) {
            dpTime[nu] = nt;
            dpChoice[nu] = { u, item };
          }
        }
      }

      if (dpTime[maxUnits] === Infinity) return { time: 0, picks: [] };

      const picks = [];
      let cursor = maxUnits;
      while (cursor > 0 && dpChoice[cursor]) {
        const { u, item } = dpChoice[cursor];
        picks.push(item);
        cursor = u;
      }
      picks.reverse();

      return { time: dpTime[maxUnits], picks };
    }

    function defaultTarget(leaderboard, currentName) {
      const idx = leaderboard.findIndex(p => p.name === currentName);
      if (idx <= 0) return leaderboard.find(p => p.name !== currentName) || null;
      return leaderboard[idx - 1];
    }

    function App() {
      const [status, setStatus] = useState("loading");
      const [errorMsg, setErrorMsg] = useState("");
      const [levels, setLevels] = useState([]);
      const [selectedPlayer, setSelectedPlayer] = useState("");
      const [targetPlayerName, setTargetPlayerName] = useState("");

      useEffect(() => {
        loadLevelsJson()
          .then(raw => {
            const processed = processRawData(raw);
            setLevels(processed);
            setStatus("ready");
          })
          .catch(err => {
            setErrorMsg(err.name === "AbortError"
              ? "Request timed out. Make sure levels.json is in the same folder."
              : `Failed to load levels.json: ${err.message}`);
            setStatus("error");
          });
      }, []);

      const leaderboard = useMemo(() => buildLeaderboard(levels), [levels]);

      const avgTimePerPoint = useMemo(() => calculateAvgTimePerPoint(levels), [levels]);
      const avgAttemptsPerPoint = useMemo(() => calculateAvgAttemptsPerPoint(levels), [levels]);

      useEffect(() => {
        if (leaderboard.length === 0) {
          setSelectedPlayer("");
          setTargetPlayerName("");
          return;
        }

        const selectedIsValid = leaderboard.some(p => p.name === selectedPlayer);
        const targetIsValid = leaderboard.some(p => p.name === targetPlayerName) && targetPlayerName !== selectedPlayer;

        if (leaderboard.length === 1) {
          if (!selectedIsValid) {
            setSelectedPlayer(leaderboard[0].name);
          }
          if (targetPlayerName) {
            setTargetPlayerName("");
          }
          return;
        }

        if (!selectedIsValid) {
          setSelectedPlayer(leaderboard[1].name);
          return;
        }

        if (!targetIsValid) {
          setTargetPlayerName(leaderboard[0].name);
        }
      }, [leaderboard, selectedPlayer, targetPlayerName]);

      function handleSelectPlayer(name) {
        setSelectedPlayer(name);
        if (targetPlayerName === name) {
          setTargetPlayerName(defaultTarget(leaderboard, name)?.name || "");
        }
      }

      function handleSetTarget(name) {
        if (name === selectedPlayer) return;
        setTargetPlayerName(name);
      }

      const currentPlayer = useMemo(
        () => leaderboard.find(p => p.name === selectedPlayer) || null,
        [leaderboard, selectedPlayer]
      );

      const skillComponents = useMemo(
        () => (currentPlayer ? calculateSkillComponents(levels, currentPlayer.name) : { speed: 1, attempts: 1 }),
        [levels, currentPlayer]
      );

      const skillMultiplier = useMemo(
        () => (currentPlayer ? calculatePlayerSkill(levels, currentPlayer.name) : 1),
        [levels, currentPlayer]
      );

      const skillClassification = useMemo(() => classifySkill(skillMultiplier), [skillMultiplier]);
      const skillComparison = useMemo(() => describeSkillRelative(skillMultiplier), [skillMultiplier]);

      const targetPlayer = useMemo(
        () => leaderboard.find(p => p.name === targetPlayerName) || null,
        [leaderboard, targetPlayerName]
      );

      const recommendations = useMemo(
        () => buildRecommendations(levels, currentPlayer, avgTimePerPoint, avgAttemptsPerPoint),
        [levels, currentPlayer, avgTimePerPoint, avgAttemptsPerPoint]
      );

      const pointsNeeded = Math.max(
        0,
        (targetPlayer?.points || 0) - (currentPlayer?.points || 0)
      );

      const optimized = useMemo(
        () => optimizeRoute(recommendations, pointsNeeded),
        [recommendations, pointsNeeded]
      );

      const projectedPath = optimized?.picks || [];
      const totalPoints = projectedPath.reduce((a, b) => a + b.projectedPoints, 0);
      const totalHours = projectedPath.reduce((a, b) => a + b.expectedHours, 0);
      const targetRank = leaderboard.findIndex(p => p.name === targetPlayerName) + 1;

      if (status === "loading") {
        return (
          <div className="optimizer-shell optimizer-shell-center">
            <div className="optimizer-loading-card">
              <div className="optimizer-spinner"></div>
              <p>Loading levels.json…</p>
            </div>
          </div>
        );
      }

      if (status === "error") {
        return (
          <div className="optimizer-shell optimizer-shell-center">
            <div className="optimizer-error-card">
              <div className="optimizer-error-icon">⚠</div>
              <p className="optimizer-error-title">Could not load data</p>
              <p>{errorMsg}</p>
              <p className="optimizer-error-help">
                Make sure <code>efficiency.html</code> and <code>levels.json</code> are in the same folder and served over HTTP.
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="optimizer-shell">
          <div className="optimizer-page">
            <header className="optimizer-header">
              <div>
                <h1>Practice Mode List Optimized Ladder</h1>
                <p className="optimizer-subtitle">Compare your progress against the leaderboard and plan the most efficient route.</p>
              </div>
              <div className="optimizer-meta">
                <div>{levels.length} levels loaded</div>
                <div>{leaderboard.length} players</div>
              </div>
            </header>

            <section className="optimizer-card">
              <div className="optimizer-card-head">
                <h2>Leaderboard</h2>
                <div className="optimizer-legend">
                  <span className="optimizer-legend-item"><span className="optimizer-dot optimizer-dot-you"></span>You</span>
                  <span className="optimizer-legend-item"><span className="optimizer-dot optimizer-dot-target"></span>Target</span>
                </div>
              </div>
              {leaderboard.length === 0 ? (
                <div className="optimizer-empty">No player data found in levels.json.</div>
              ) : (
                <div className="optimizer-player-grid">
                  {leaderboard.map((player, i) => {
                    const isMe = player.name === selectedPlayer;
                    const isTarget = player.name === targetPlayerName;
                    return (
                      <div
                        key={player.name}
                        className={`optimizer-player-card ${isMe && isTarget ? "optimizer-player-card-active" : isMe ? "optimizer-player-card-me" : isTarget ? "optimizer-player-card-target" : ""}`}
                      >
                        <div className="optimizer-player-main">
                          <div className="optimizer-player-name">
                            <span className="optimizer-rank">#{i + 1}</span>
                            {player.name}
                          </div>
                          <div className="optimizer-player-meta">
                            {player.levels.length} · {player.points.toFixed(1)} pts
                          </div>
                        </div>
                        <div className="optimizer-player-actions">
                          <button
                            onClick={() => handleSelectPlayer(player.name)}
                            className={`optimizer-action-btn ${isMe ? "optimizer-action-btn-me" : "optimizer-action-btn-default"}`}
                          >
                            Me
                          </button>
                          <button
                            onClick={() => handleSetTarget(player.name)}
                            disabled={isMe}
                            className={`optimizer-action-btn ${isTarget ? "optimizer-action-btn-target" : isMe ? "optimizer-action-btn-disabled" : "optimizer-action-btn-default"}`}
                          >
                            Target
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>

            {currentPlayer && (
              <section className="optimizer-card">
                <div className="optimizer-card-head optimizer-card-head-stack">
                  <h2>Optimal Route</h2>
                  {targetPlayer ? (
                    <span className="optimizer-target-caption">
                      <span>Targeting </span>
                      <span className="optimizer-target-name">#{targetRank} {targetPlayer.name}</span>
                      <span> — {targetPlayer.points.toFixed(1)} pts</span>
                    </span>
                  ) : (
                    <span className="optimizer-target-caption">No target selected</span>
                  )}
                </div>
                <div className="optimizer-skill-summary">
                  <div className="optimizer-skill-main">
                    <span className="optimizer-skill-label">Your Skill Rating</span>
                    <span className="optimizer-skill-value">{formatSkillMultiplier(skillMultiplier)}</span>
                  </div>
                  <div className="optimizer-skill-details">
                    <div className="optimizer-skill-classification">{skillClassification}</div>
                    <div className="optimizer-skill-comparison">{skillComparison}</div>
                    <div className="optimizer-skill-breakdown">
                      <span>Speed: {formatSkillMultiplier(skillComponents.speed)}</span>
                      <span>Attempts: {formatSkillMultiplier(skillComponents.attempts)}</span>
                    </div>
                  </div>
                </div>
                <div className="optimizer-stats-grid">
                  <div className="optimizer-stat-box">
                    <span className="optimizer-stat-label">Your Points</span>
                    <span className="optimizer-stat-value">{currentPlayer.points.toFixed(1)}</span>
                  </div>
                  <div className="optimizer-stat-box">
                    <span className="optimizer-stat-label">Points Needed</span>
                    <span className="optimizer-stat-value">{pointsNeeded.toFixed(1)}</span>
                  </div>
                  <div className="optimizer-stat-box">
                    <span className="optimizer-stat-label">Route Gain</span>
                    <span className="optimizer-stat-value">{totalPoints.toFixed(1)}</span>
                  </div>
                  <div className="optimizer-stat-box">
                    <span className="optimizer-stat-label">Est. Time</span>
                    <span className="optimizer-stat-value">{formatHours(totalHours)}</span>
                  </div>
                </div>
                {projectedPath.length === 0 ? (
                  <div className="optimizer-empty">
                    {!targetPlayer
                      ? "Select a target player to generate a route."
                      : pointsNeeded === 0
                        ? `${currentPlayer.name} already meets or exceeds ${targetPlayer.name}'s score.`
                        : "No viable route found — not enough unbeaten levels with point data."}
                  </div>
                ) : (
                  <div className="optimizer-table-wrap">
                    <table className="optimizer-table">
                      <thead>
                        <tr>
                          <th>Level</th>
                          <th>Victors</th>
                          <th>Base Pts</th>
                          <th>Mult</th>
                          <th>Proj. Pts</th>
                          <th>Est. Time</th>
                          <th>Time WR</th>
                          <th>Attempts WR</th>
                          <th>EV (pts/hr)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {projectedPath.map(rec => (
                          <tr key={rec.level}>
                            <td>{rec.level}</td>
                            <td>{rec.victorCount}</td>
                            <td>{rec.basePoints.toFixed(1)}</td>
                            <td>{rec.projectedMult.toFixed(2)}×</td>
                            <td>{rec.projectedPoints.toFixed(1)}</td>
                            <td>{formatHours(rec.expectedHours)}</td>
                            <td>{rec.hasWrTime ? (rec.timeWrPossible ? "Yes" : "No") : "N/A"}</td>
                            <td>{rec.hasWrAttempts ? (rec.attemptsWrPossible ? "Yes" : "No") : "N/A"}</td>
                            <td className="optimizer-ev">{rec.expectedValue.toFixed(2)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </section>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
