<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Mode List Optimal Ladder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-zinc-950 text-zinc-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useMemo, useState, useEffect } = React;
    const LOCAL_KEY = "pml_edit_data";

    function parseTimeToSeconds(timeStr) {
      if (!timeStr || typeof timeStr !== "string") return null;
      const s = timeStr.trim();
      if (!s) return null;

      const parts = {};
      const tokenRegex = /(\d+)\s*([hms])/gi;
      let match;

      while ((match = tokenRegex.exec(s)) !== null) {
        const unit = match[2].toLowerCase();
        if (parts[unit] !== undefined) return null;
        parts[unit] = parseInt(match[1], 10);
      }

      if (Object.keys(parts).length === 0) return null;

      if ("h" in parts && "m" in parts && parts["m"] >= 60) return null;
      if (("h" in parts || "m" in parts) && "s" in parts && parts["s"] >= 60) return null;

      const h = parts["h"] || 0;
      const m = parts["m"] || 0;
      const sec = parts["s"] || 0;
      const total = h * 3600 + m * 60 + sec;
      return total > 0 ? total : null;
    }

    function calculatePoints(rank, maxRank) {
      if (!rank || !maxRank) return 0;
      const base = 10, top = 360;
      if (maxRank === 1) return top;
      const ratio = Math.pow(top / base, 1 / (maxRank - 1));
      return base * Math.pow(ratio, maxRank - rank);
    }

    function loadLevelsJson() {
      const saved = localStorage.getItem(LOCAL_KEY);
      if (saved) {
        try {
          return Promise.resolve(JSON.parse(saved));
        } catch (_) { }
      }
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      return fetch("levels.json", { signal: controller.signal })
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .finally(() => clearTimeout(timeout));
    }

    function processRawData(data) {
      const rawLevels = data
        .filter(item => item.name)
        .map(item => {
          const victors = (item.victors || []).map(v => ({
            name: v.name || "",
            date: v.date || "",
            time: v.time || "",
            attempts: v.attempts || 0,
            videoUrl: v.video || "",
          }));
          return {
            rank: item.rank,
            name: item.name,
            id: item.id,
            points: 0,
            victors,
            creator: item.creators,
          };
        });

      const maxRank = Math.max(...rawLevels.map(l => l.rank), 1);
      rawLevels.forEach(l => {
        l.points = calculatePoints(l.rank, maxRank);
      });

      rawLevels.forEach(level => {
        let minTimeSec = null;
        let minAttempts = null;
        let wrTimeObj = null;
        let wrAttemptsObj = null;

        level.victors.forEach(v => {
          const sec = parseTimeToSeconds(v.time);
          if (sec !== null && (minTimeSec === null || sec < minTimeSec)) {
            minTimeSec = sec;
            wrTimeObj = { name: v.name, time: v.time };
          }
          if (v.attempts > 0 && (minAttempts === null || v.attempts < minAttempts)) {
            minAttempts = v.attempts;
            wrAttemptsObj = { name: v.name, attempts: v.attempts };
          }
        });

        level.wrTime = wrTimeObj;
        level.wrAttempts = wrAttemptsObj;
      });

      return rawLevels;
    }

    function buildLeaderboard(levels) {
      const map = {};
      levels.forEach(lvl => {
        const seenInLevel = new Set();
        lvl.victors.forEach((v, vi) => {
          if (!v.name || seenInLevel.has(v.name)) return;
          seenInLevel.add(v.name);

          if (!map[v.name]) map[v.name] = { name: v.name, points: 0, levels: [] };

          let mult = 1;
          if (vi === 0) mult += 0.25;
          if (lvl.wrTime && v.name === lvl.wrTime.name) mult += 0.25;
          if (lvl.wrAttempts && v.name === lvl.wrAttempts.name) mult += 0.25;

          map[v.name].points += lvl.points * mult;
          map[v.name].levels.push(lvl.name);
        });
      });
      return Object.values(map).sort((a, b) => b.points - a.points);
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function trimmedMean(arr, trimFraction = 0.1) {
      if (!arr.length) return null;
      const sorted = [...arr].sort((a, b) => a - b);
      const trimCount = Math.floor(sorted.length * trimFraction);
      const end = sorted.length - trimCount;
      const source = trimCount < end ? sorted.slice(trimCount, end) : sorted;
      return source.reduce((a, b) => a + b, 0) / source.length;
    }

    function geometricMean(arr) {
      if (!arr.length) return null;
      const logSum = arr.reduce((acc, v) => acc + Math.log(v), 0);
      return Math.exp(logSum / arr.length);
    }

    function formatHours(hours) {
      if (hours < 1) return `${(hours * 60).toFixed(1)}m`;
      return `${hours.toFixed(2)}h`;
    }

    function calculateGlobalBaseline(levels) {
      const allTimes = [];
      levels.forEach(lvl => {
        lvl.victors.forEach(v => {
          const t = parseTimeToSeconds(v.time);
          if (t !== null && t > 0) allTimes.push(t);
        });
      });
      return geometricMean(allTimes) || 1800;
    }

    function calculatePlayerSkill(levels, playerName, globalBaseline) {
      const times = [];
      levels.forEach(lvl => {
        lvl.victors.forEach(v => {
          if (v.name !== playerName) return;
          const t = parseTimeToSeconds(v.time);
          if (t !== null && t > 0) times.push(t);
        });
      });
      if (!times.length) return 1;
      const gm = geometricMean(times);
      if (gm === null) return 1;
      return clamp(gm / globalBaseline, 0.5, 3);
    }

    function estimateLevelTime(level, skillMultiplier) {
      const victorTimes = level.victors
        .map(v => parseTimeToSeconds(v.time))
        .filter(t => t !== null && t > 0);

      let baseTime;
      if (victorTimes.length > 0) {
        baseTime = trimmedMean(victorTimes);
      } else {
        const wrSec = level.wrTime ? parseTimeToSeconds(level.wrTime.time) : null;
        baseTime = wrSec !== null ? wrSec * 1.8 : 7200;
      }

      if (!baseTime || baseTime <= 0) return null;
      return baseTime * skillMultiplier;
    }

    function buildRecommendations(levels, player, globalBaseline) {
      if (!player) return [];
      const beaten = new Set(player.levels);
      const skill = calculatePlayerSkill(levels, player.name, globalBaseline);

      return levels
        .filter(lvl => !beaten.has(lvl.name))
        .map(lvl => {
          const basePoints = lvl.points || 0;
          if (basePoints <= 0) return null;

          const expectedSeconds = estimateLevelTime(lvl, skill);
          if (expectedSeconds === null || expectedSeconds <= 0) return null;

          const expectedHours = expectedSeconds / 3600;
          let projectedMult = 1.0;
          if (lvl.victors.length === 0) projectedMult += 0.25;
          const projectedPoints = basePoints * projectedMult;
          const expectedValue = projectedPoints / expectedHours;

          return {
            level: lvl.name,
            basePoints,
            projectedMult,
            projectedPoints,
            expectedHours,
            expectedValue,
            victorCount: lvl.victors.length,
          };
        })
        .filter(Boolean)
        .sort((a, b) => b.expectedValue - a.expectedValue);
    }

    function optimizeRoute(recommendations, targetPoints) {
      if (!recommendations.length || targetPoints <= 0) return { time: 0, picks: [] };

      let accumulated = 0;
      const picks = [];

      for (const rec of recommendations) {
        if (accumulated >= targetPoints) break;
        picks.push(rec);
        accumulated += rec.projectedPoints;
      }

      if (accumulated < targetPoints) return { time: 0, picks: [] };
      return { time: picks.reduce((a, b) => a + b.expectedHours, 0), picks };
    }

    function defaultTarget(leaderboard, currentName) {
      return leaderboard.find(p => p.name !== currentName) || null;
    }

    function App() {
      const [status, setStatus] = useState("loading");
      const [errorMsg, setErrorMsg] = useState("");
      const [levels, setLevels] = useState([]);
      const [selectedPlayer, setSelectedPlayer] = useState("");
      const [targetPlayerName, setTargetPlayerName] = useState("");

      useEffect(() => {
        loadLevelsJson()
          .then(raw => {
            const processed = processRawData(raw);
            setLevels(processed);
            setStatus("ready");
          })
          .catch(err => {
            setErrorMsg(err.name === "AbortError"
              ? "Request timed out. Make sure levels.json is in the same folder."
              : `Failed to load levels.json: ${err.message}`);
            setStatus("error");
          });
      }, []);

      const leaderboard = useMemo(() => buildLeaderboard(levels), [levels]);

      const globalBaseline = useMemo(() => calculateGlobalBaseline(levels), [levels]);

      useEffect(() => {
        if (leaderboard.length === 0) {
          setSelectedPlayer("");
          setTargetPlayerName("");
          return;
        }
        let resolved = selectedPlayer;
        if (!leaderboard.some(p => p.name === selectedPlayer)) {
          resolved = leaderboard[0].name;
          setSelectedPlayer(resolved);
        }
        const targetValid =
          leaderboard.some(p => p.name === targetPlayerName) &&
          targetPlayerName !== resolved;
        if (!targetValid) {
          setTargetPlayerName(defaultTarget(leaderboard, resolved)?.name || "");
        }
      }, [leaderboard]);

      function handleSelectPlayer(name) {
        setSelectedPlayer(name);
        if (targetPlayerName === name) {
          setTargetPlayerName(defaultTarget(leaderboard, name)?.name || "");
        }
      }

      function handleSetTarget(name) {
        if (name === selectedPlayer) return;
        setTargetPlayerName(name);
      }

      const currentPlayer = useMemo(
        () => leaderboard.find(p => p.name === selectedPlayer) || null,
        [leaderboard, selectedPlayer]
      );

      const targetPlayer = useMemo(
        () => leaderboard.find(p => p.name === targetPlayerName) || null,
        [leaderboard, targetPlayerName]
      );

      const recommendations = useMemo(
        () => buildRecommendations(levels, currentPlayer, globalBaseline),
        [levels, currentPlayer, globalBaseline]
      );

      const pointsNeeded = Math.max(
        0,
        (targetPlayer?.points || 0) - (currentPlayer?.points || 0)
      );

      const optimized = useMemo(
        () => optimizeRoute(recommendations, pointsNeeded),
        [recommendations, pointsNeeded]
      );

      const projectedPath = optimized?.picks || [];
      const totalPoints = projectedPath.reduce((a, b) => a + b.projectedPoints, 0);
      const totalHours = projectedPath.reduce((a, b) => a + b.expectedHours, 0);
      const targetRank = leaderboard.findIndex(p => p.name === targetPlayerName) + 1;

      if (status === "loading") {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center space-y-3">
              <div className="w-8 h-8 border-2 border-zinc-600 border-t-zinc-300 rounded-full animate-spin mx-auto"></div>
              <p className="text-zinc-400 text-sm">Loading levels.json…</p>
            </div>
          </div>
        );
      }

      if (status === "error") {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="bg-zinc-900 border border-red-900 rounded-2xl p-6 max-w-md text-center space-y-3">
              <div className="text-red-400 text-2xl">⚠</div>
              <p className="font-semibold text-red-300">Could not load data</p>
              <p className="text-zinc-400 text-sm">{errorMsg}</p>
              <p className="text-zinc-500 text-xs">
                Make sure <code className="text-zinc-300">efficiency.html</code> and{" "}
                <code className="text-zinc-300">levels.json</code> are in the same folder
                and served over HTTP (not opened as a local file).
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-6">
          <div className="max-w-7xl mx-auto space-y-6">
            <div className="flex items-end justify-between">
              <div>
                <h1 className="text-4xl font-bold">Practice Mode List Optimized Ladder</h1>
              </div>
              <div className="text-right text-sm text-zinc-500">
                <div>{levels.length} levels loaded</div>
                <div>{leaderboard.length} players</div>
              </div>
            </div>

            <div className="bg-zinc-900 rounded-2xl p-4 border border-zinc-800">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-xl font-semibold">Leaderboard</h2>
                <div className="flex items-center gap-3 text-xs text-zinc-500">
                  <span className="flex items-center gap-1.5">
                    <span className="inline-block w-2 h-2 rounded-sm bg-blue-600"></span>
                    You
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="inline-block w-2 h-2 rounded-sm bg-amber-600"></span>
                    Target
                  </span>
                </div>
              </div>
              {leaderboard.length === 0 ? (
                <div className="text-zinc-500 text-sm text-center py-10">
                  No player data found in levels.json.
                </div>
              ) : (
                <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-1.5 max-h-72 overflow-auto pr-1">
                  {leaderboard.map((player, i) => {
                    const isMe = player.name === selectedPlayer;
                    const isTarget = player.name === targetPlayerName;
                    return (
                      <div
                        key={player.name}
                        className={`flex items-center gap-2 rounded-xl border px-3 py-2 transition-colors ${isMe && isTarget ? "bg-zinc-800 border-zinc-600"
                            : isMe ? "bg-blue-950 border-blue-800"
                              : isTarget ? "bg-amber-950 border-amber-800"
                                : "bg-zinc-950 border-zinc-800"
                          }`}
                      >
                        <div className="flex-1 min-w-0">
                          <div className="font-semibold text-sm truncate">
                            <span className="text-zinc-500 mr-1">#{i + 1}</span>
                            {player.name}
                          </div>
                          <div className="text-xs text-zinc-400">
                            {player.levels.length} · {player.points.toFixed(1)} pts
                          </div>
                        </div>
                        <div className="flex gap-1 shrink-0">
                          <button
                            onClick={() => handleSelectPlayer(player.name)}
                            className={`px-2 py-0.5 rounded-md text-xs font-semibold transition-colors ${isMe
                                ? "bg-blue-600 text-white"
                                : "bg-zinc-800 text-zinc-400 hover:bg-blue-900 hover:text-blue-300"
                              }`}
                          >
                            Me
                          </button>
                          <button
                            onClick={() => handleSetTarget(player.name)}
                            disabled={isMe}
                            className={`px-2 py-0.5 rounded-md text-xs font-semibold transition-colors ${isTarget ? "bg-amber-600 text-white"
                                : isMe ? "bg-zinc-900 text-zinc-700 cursor-not-allowed"
                                  : "bg-zinc-800 text-zinc-400 hover:bg-amber-900 hover:text-amber-300"
                              }`}
                          >
                            Target
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {currentPlayer && (
              <div className="bg-zinc-900 rounded-2xl p-4 border border-zinc-800">
                <div className="flex flex-wrap items-baseline justify-between gap-2 mb-6">
                  <h2 className="text-2xl font-semibold">Optimal Route</h2>
                  {targetPlayer ? (
                    <span className="text-sm text-zinc-400">
                      <span className="text-zinc-500">Targeting </span>
                      <span className="text-amber-400 font-medium">
                        #{targetRank} {targetPlayer.name}
                      </span>
                      <span className="text-zinc-500"> — {targetPlayer.points.toFixed(1)} pts</span>
                    </span>
                  ) : (
                    <span className="text-sm text-zinc-500">No target selected</span>
                  )}
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                  {[
                    { label: "Your Points", value: currentPlayer.points.toFixed(1) },
                    { label: "Points Needed", value: pointsNeeded.toFixed(1) },
                    { label: "Route Gain", value: totalPoints.toFixed(1) },
                    { label: "Est. Time", value: formatHours(totalHours) },
                  ].map(({ label, value }) => (
                    <div key={label} className="bg-zinc-950 rounded-xl p-4 border border-zinc-800">
                      <div className="text-xs text-zinc-400 uppercase tracking-wide">{label}</div>
                      <div className="text-2xl font-bold mt-1">{value}</div>
                    </div>
                  ))}
                </div>
                {projectedPath.length === 0 ? (
                  <div className="text-zinc-500 text-center py-10">
                    {!targetPlayer
                      ? "Select a target player to generate a route."
                      : pointsNeeded === 0
                        ? `${currentPlayer.name} already meets or exceeds ${targetPlayer.name}'s score.`
                        : "No viable route found — not enough unbeaten levels with point data."}
                  </div>
                ) : (
                  <div className="overflow-auto">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="border-b border-zinc-800 text-left text-xs uppercase tracking-wide text-zinc-500">
                          <th className="pb-3 pr-4">Level</th>
                          <th className="pb-3 pr-4">Victors</th>
                          <th className="pb-3 pr-4">Base Pts</th>
                          <th className="pb-3 pr-4">Mult</th>
                          <th className="pb-3 pr-4">Proj. Pts</th>
                          <th className="pb-3 pr-4">Est. Time</th>
                          <th className="pb-3">EV (pts/hr)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {projectedPath.map(rec => (
                          <tr key={rec.level} className="border-b border-zinc-900 hover:bg-zinc-950 transition-colors">
                            <td className="py-3 pr-4 font-medium">{rec.level}</td>
                            <td className="py-3 pr-4 text-zinc-400">{rec.victorCount}</td>
                            <td className="py-3 pr-4 text-zinc-400">{rec.basePoints.toFixed(1)}</td>
                            <td className="py-3 pr-4 text-zinc-400">{rec.projectedMult.toFixed(2)}×</td>
                            <td className="py-3 pr-4">{rec.projectedPoints.toFixed(1)}</td>
                            <td className="py-3 pr-4">{formatHours(rec.expectedHours)}</td>
                            <td className="py-3 font-bold text-blue-400">{rec.expectedValue.toFixed(2)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
